name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check GH_PACKAGES_TOKEN
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Secret GH_PACKAGES_TOKEN ausente. Crie em Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
