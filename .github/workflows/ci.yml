name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check NPM_TOKEN
        run: test -n "$NPM_TOKEN" || { echo "::error::Secret NPM_TOKEN ausente: crie em Settings > Secrets and variables > Actions."; exit 1; }
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
